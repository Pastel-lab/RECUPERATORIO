<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="icon" href="./public/images/vsLogo.png" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Goku vs Naruto - Arcade Fighter</title>
		<link rel="stylesheet" href="src/style.css" />
		<script type="module" src="src/index.js"></script>
	</head>

	<body>
		<main>
			<canvas width="382px" height="224px"></canvas>
		</main>
		<audio
			id="kensTheme"
			src="./public/sounds/kens-theme.ogg"
			preload="auto"
			loop
		></audio>
		<audio
			id="sound-fighter-land"
			src="./public/sounds/land.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-kick-hit"
			src="./public/sounds/light-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-kick-hit"
			src="./public/sounds/medium-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-kick-hit"
			src="./public/sounds/heavy-kick-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-attack"
			src="./public/sounds/light-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-attack"
			src="./public/sounds/medium-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-attack"
			src="./public/sounds/heavy-attack.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-light-punch-hit"
			src="./public/sounds/light-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-medium-punch-hit"
			src="./public/sounds/medium-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-fighter-heavy-punch-hit"
			src="./public/sounds/heavy-punch-hit.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-goku-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>
		<audio
			id="sound-naruto-hadouken"
			src="./public/sounds/hadouken.ogg"
			preload="auto"
		></audio>

		<img id="StageImage" src="./public/images/stage.png" alt="stage" />
		<img id="hud" src="./public/images/hud.png" alt="HUD" />
		<img id="GokuImage" src="./public/images/Goku.png" alt="Goku" />
		<img id="GokuFxImage" src="./public/images/GokuFx.png" alt="Goku FX" />
		<img id="NarutoFxImage" src="./public/images/NarutoFx.png" alt="Naruto FX" />
		<img id="NarutoImage" src="./public/images/Naruto.png" alt="Naruto" />
		<img id="ShadowImage" src="./public/images/shadow.png" alt="Shadow" />
		<img id="Decals" src="./public/images/decals.png" alt="Decals" />
		<img id="Controls" src="./public/images/Controls.png" alt="Controls" />
		<img id="Logo" src="./public/images/logo.png" alt="Logo" />
		<img id="Winner" src="./public/images/winnerText.png" alt="Winner" />
	</body>
</html>
